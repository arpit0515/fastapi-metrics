name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package with dev extras
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (black)
        run: black --check .

      - name: Run tests
        run: pytest

  fastapi-compat:
    name: fastapi (${{ matrix.fastapi-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - fastapi-version: "0.100.0"
          - fastapi-version: "latest"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Pin fastapi version under test
        if: matrix.fastapi-version != 'latest'
        run: pip install "fastapi==${{ matrix.fastapi-version }}"

      - name: Upgrade fastapi to latest
        if: matrix.fastapi-version == 'latest'
        run: pip install --upgrade fastapi

      - name: Run tests
        run: pytest
